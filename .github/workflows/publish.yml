---
name: Publish packages

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

# No caches in this workflow: a poisoned cache must not reach the published package.
jobs:
  publish:
    runs-on: ubuntu-latest

    permissions:
      id-token: write
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Set up Node.js and Bun
        uses: jdx/mise-action@924e7c586e33d7d4bae9c14e26c5d22e2beb6e78 # v5.3.0
        with:
          install_args: node bun # versions from mise.toml
          cache: false

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Test
        run: bun run test

      - name: Publish to npm
        run: npm publish --provenance --access public
