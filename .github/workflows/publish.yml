---
name: Publish packages

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

# No caches in this workflow: a poisoned cache must not reach the published package.
jobs:
  publish:
    runs-on: ubuntu-latest

    permissions:
      id-token: write
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Set up Node.js and Bun
        uses: jdx/mise-action@924e7c586e33d7d4bae9c14e26c5d22e2beb6e78 # v5.3.0
        with:
          install_args: node bun # versions from mise.toml
          cache: false

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Test
        run: bun run test

      - name: Publish to npm
        run: npm publish --provenance --access public

  # Docker Hub has no OIDC for personal accounts, so this uses an access
  # token, stored only in the environment `docker-hub`.
  docker:
    name: Publish to Docker Hub
    runs-on: ubuntu-latest
    environment:
      name: docker-hub
      url: https://hub.docker.com/r/udondan/marktguru
    permissions:
      contents: read
      id-token: write # keyless cosign signature
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          fetch-depth: 1
          persist-credentials: false

      # The image takes the compiled dist/, it doesn't compile TypeScript itself.
      - name: Set up Node.js and Bun
        uses: jdx/mise-action@924e7c586e33d7d4bae9c14e26c5d22e2beb6e78 # v5.3.0
        with:
          install_args: node bun # versions from mise.toml
          cache: false

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build
        run: bun run build

      - uses: sigstore/cosign-installer@881c63bd87e38389154debd8331404ce7ca8a3ab # v4.1.4
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # Release tag v1.2.3 → 1.2.3, 1.2, 1 and latest.
      - id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: udondan/marktguru
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}

      - id: push
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          provenance: mode=max
          sbom: true

      # Keyless: the signature names this workflow as signer, via GitHub OIDC
      # and the public Sigstore log. Signing the digest covers all tags.
      - name: Sign the image
        env:
          DIGEST: ${{ steps.push.outputs.digest }}
        run: cosign sign --yes "udondan/marktguru@${DIGEST}"

  # Lists the npm package in the MCP Registry as io.github.udondan/marktguru.
  # The registry checks the mcpName of the published package, so this runs
  # after npm has the release. Only for release tags, not workflow_dispatch
  # on a branch.
  mcp-registry:
    name: Publish to MCP Registry
    needs: publish
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # login via GitHub OIDC
    env:
      MCP_PUBLISHER_VERSION: v1.8.16
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          fetch-depth: 1
          persist-credentials: false

      # release-please keeps both versions in server.json in step with the release.
      - name: Check the version in server.json
        env:
          TAG: ${{ github.ref_name }}
        run: |
          version="${TAG#v}"
          for path in .version '.packages[0].version'; do
            actual=$(jq -r "$path" server.json)
            if [ "$actual" != "$version" ]; then
              echo "::error::server.json $path is $actual, the release is $version"
              exit 1
            fi
          done

      # npm takes a few minutes before it serves a new version, and the
      # registry rejects the publish until it does. Waits at most 15 minutes.
      - name: Wait for the release on npm
        env:
          TAG: ${{ github.ref_name }}
        run: |
          set -uo pipefail
          version="${TAG#v}"
          name=$(jq -r .name server.json)
          package=$(jq -r '.packages[0].identifier' server.json)
          url="https://registry.npmjs.org/$(jq -rn --arg p "$package" '$p | @uri')/${version}"
          for _ in $(seq 30); do
            # In the condition, a 404 doesn't stop the step (bash -e).
            if mcp_name=$(curl --fail --silent --show-error --location "$url" | jq -r .mcpName) &&
              [ "$mcp_name" = "$name" ]; then
              echo "npm serves $package@$version with mcpName $name"
              exit 0
            fi
            echo "npm does not serve $package@$version with mcpName $name yet"
            sleep 30
          done
          echo "::error::npm did not serve $package@$version with mcpName $name within 15 minutes"
          exit 1

      - uses: sigstore/cosign-installer@881c63bd87e38389154debd8331404ce7ca8a3ab # v4.1.4

      - name: Download and verify mcp-publisher
        run: |
          set -euo pipefail
          os="$(uname -s | tr '[:upper:]' '[:lower:]')"
          arch="$(uname -m | sed 's/x86_64/amd64/;s/aarch64/arm64/')"
          archive="mcp-publisher_${os}_${arch}.tar.gz"
          base_url="https://github.com/modelcontextprotocol/registry/releases/download/${MCP_PUBLISHER_VERSION}"

          curl --fail --location --silent --show-error --output "$archive" "$base_url/$archive"
          curl --fail --location --silent --show-error --output "$archive.sigstore.json" "$base_url/$archive.sigstore.json"
          cosign verify-blob \
            --bundle "$archive.sigstore.json" \
            --certificate-identity "https://github.com/modelcontextprotocol/registry/.github/workflows/release.yml@refs/tags/${MCP_PUBLISHER_VERSION}" \
            --certificate-oidc-issuer "https://token.actions.githubusercontent.com" \
            "$archive"
          tar xzf "$archive" mcp-publisher
          rm -f "$archive" "$archive.sigstore.json"

      - name: Log in to the MCP Registry
        run: ./mcp-publisher login github-oidc

      - name: Publish to the MCP Registry
        run: ./mcp-publisher publish
