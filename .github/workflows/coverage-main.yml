---
name: Coverage

# Codecov compares the coverage of a pull request against main, so main needs
# a report as well. The Test workflow runs on main too, but only after all
# waiting pull requests. This workflow runs just the offline tests and uploads
# their coverage right away, so pull requests have a report to compare against.

on:
  push:
    branches:
      - main

permissions: {}

concurrency:
  group: coverage-${{ github.ref }}
  cancel-in-progress: false

jobs:
  coverage:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # Codecov upload via OIDC
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Node.js and Bun
        uses: jdx/mise-action@90f833d396d0cc3674b631d2d225e306476c303a # v5.2.10
        with:
          install_args: node bun # versions from mise.toml

      - name: Install dependencies
        run: make install

      - name: Test
        run: make test-unit

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          use_oidc: true
          fail_ci_if_error: false
          files: coverage/lcov.info
