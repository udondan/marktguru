---
config:
  # Prose is wrapped by Prettier where it can be, but tables and command lines can't be wrapped.
  MD013: false
  # The README banner is a <picture> element so it can switch between light and dark images.
  MD033:
    allowed_elements: [picture, source, img]

globs:
  - "**/*.md"

ignores:
  # Generated by release-please.
  - CHANGELOG.md
  - .claude/**
  - coverage/**
  - dist/**
  - node_modules/**
